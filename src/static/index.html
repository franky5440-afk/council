<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'none'; form-action 'none'; base-uri 'none'">
<title>council</title>
<style>
:root {
  --bg:         #0F0F10;
  --panel:      #17181A;
  --panel-2:    #1E1F22;
  --panel-3:    #26282C;
  --line:       #2A2C30;
  --text:       #F2F2F3;
  --muted:      #8B8D93;
  --accent:     #E6D07C;
  --accent-ink: #141414;
  --mint:       #B9E8CE;
  --sage:       #CFE9D4;
  --danger:     #FF6B6B;
  --radius-lg:  20px;
  --radius:     14px;
  --radius-sm:  10px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans TC", "Noto Sans CJK TC", sans-serif;
  margin: 0;
}

h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; }

.app {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr) 320px;
  gap: 16px;
  padding: 16px;
  min-height: 100vh;
  align-items: start;
}

.main-col {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

#sidebar {
  background: var(--panel);
  border-radius: var(--radius-lg);
  padding: 20px 16px;
  position: sticky;
  top: 16px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  min-height: calc(100vh - 32px);
}
.brand-name { font-size: 1.25rem; font-weight: 600; }
.brand-sub { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.sidebar-divider { height: 1px; background: var(--line); margin: 16px 0; border: 0; }
#sidebar #btn-new { width: 100%; margin-bottom: 20px; }
.sidebar-section-title { font-size: 0.75rem; color: var(--muted); letter-spacing: .08em; font-weight: 600; margin-bottom: 10px; }
.seat-row {
  padding: 10px 12px;
  background: var(--panel-2);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  font-size: .82rem;
  line-height: 1.5;
}
.sidebar-spacer { margin-top: auto; }

#status-bar {
  background: var(--panel);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: flex-end;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--muted);
  font-size: .78rem;
  border: 1px solid var(--line);
}
.chip:empty { display: none; }
.chip-busy { color: var(--accent); }
.chip-alert { color: var(--danger); border-color: var(--danger); }

#mode-badge {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: .78rem;
}
#mode-badge.badge-gray { background: var(--panel-2); color: var(--muted); }
#mode-badge.badge-live { background: var(--danger); color: #fff; font-weight: 600; }

.btn {
  font: inherit;
  font-size: .88rem;
  font-weight: 600;
  padding: 11px 20px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  cursor: pointer;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--panel-2); color: var(--text); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
#btn-export {
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
#live-cost-warning { color: var(--danger); font-weight: 600; font-size: .82rem; }

#form-view {
  background: var(--panel);
  border-radius: var(--radius-lg);
  padding: 24px;
}
.field { margin-bottom: 20px; }
#form-view label {
  display: block;
  font-size: .85rem;
  font-weight: 600;
  margin-bottom: 8px;
}
#form-view textarea,
#form-view input[type="text"],
#form-view input[type="file"] {
  width: 100%;
  box-sizing: border-box;
  background: var(--panel-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: inherit;
  font-size: .9rem;
  line-height: 1.55;
}
#form-view textarea:focus,
#form-view input[type="text"]:focus,
#form-view input[type="file"]:focus {
  outline: none;
  border-color: var(--accent);
}
.hint {
  display: block;
  margin-top: 6px;
  font-size: .78rem;
  color: var(--muted);
  line-height: 1.6;
}
code {
  background: var(--panel-3);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: .85em;
}
#form-error {
  color: var(--danger);
  background: rgba(255,107,107,.08);
  border: 1px solid var(--danger);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 16px;
}
#form-error:empty { display: none; }

#stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat {
  border-radius: var(--radius-lg);
  padding: 16px;
  color: var(--accent-ink);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.stat-accent { background: var(--accent); }
.stat-mint   { background: var(--mint); }
.stat-sage   { background: var(--sage); }
.stat-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(0,0,0,.82);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .95rem;
}
.stat-label { font-size: .78rem; opacity: .72; }
.stat-value { font-size: 1.6rem; font-weight: 600; line-height: 1.1; }
.stat-note { font-size: .74rem; opacity: .72; }
.stat-note:empty { display: none; }

.question-card {
  background: var(--panel);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-top: 12px;
}
#question-text { font-size: 1.05rem; font-weight: 500; }
#context-chars-text { font-size: .78rem; color: var(--muted); }

#converged-hint {
  background: rgba(185,232,206,.12);
  border: 1px solid var(--mint);
  color: var(--mint);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-top: 12px;
}
#converged-hint:empty { display: none; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin: 12px 0;
}
.card-head { font-weight: 600; font-size: .92rem; margin-bottom: 8px; }
.speech-text {
  white-space: pre-wrap;
  line-height: 1.75;
  font-size: .92rem;
  overflow-wrap: anywhere;
}
.card.arbitration { border-left: 3px solid var(--accent); }
.card.arbitration.pending { color: var(--muted); font-style: italic; }
.badge-small {
  display: inline-flex;
  padding: 3px 9px;
  margin: 0 6px 8px 0;
  font-size: .72rem;
  background: var(--panel-3);
  color: var(--muted);
  border-radius: 999px;
}
.round-heading {
  font-size: .78rem;
  color: var(--muted);
  letter-spacing: .08em;
  font-weight: 600;
  margin: 28px 0 4px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.round-heading::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

#action-row {
  position: sticky;
  bottom: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 12px;
}

#usage-panel {
  background: var(--panel);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: sticky;
  top: 16px;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  font-size: .8rem;
  box-sizing: border-box;
}
#usage-content > div:first-child { font-size: .85rem; font-weight: 600; }
.seat-block {
  background: var(--panel-2);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin: 10px 0;
}
.usage-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin: 4px 0;
}

@media (max-width: 1180px) {
  .app { grid-template-columns: 1fr; }
  #sidebar { position: static; min-height: auto; }
  #usage-panel { position: static; max-height: none; }
  #form-view { padding: 16px; }
}

@media (max-width: 700px) {
  #stat-row { grid-template-columns: 1fr; }
}

[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <aside id="sidebar">
    <div class="brand-name">◆ council</div>
    <div class="brand-sub">多個 AI CLI 輪流發言的議會</div>
    <div class="sidebar-divider"></div>
    <button id="btn-new" class="btn btn-ghost">＋ 開新討論</button>
    <div class="sidebar-section-title">席次</div>
    <div id="seat-list"></div>
    <div class="sidebar-spacer"></div>
    <div id="mode-badge" class="badge badge-gray">模式：尚未確認</div>
  </aside>

  <div class="main-col">
    <div id="status-bar">
      <span id="st-phase" class="chip"></span>
      <span id="st-busy" class="chip chip-busy"></span>
      <span id="st-sse" class="chip chip-alert"></span>
      <span id="st-id" class="chip"></span>
    </div>

    <main>
      <div id="form-view">
        <h1>建立討論</h1>
        <div id="form-error"></div>
        <form id="create-form">
          <div class="field">
            <label for="question">問題</label>
            <textarea id="question" rows="2" required></textarea>
          </div>
          <div class="field">
            <label for="advisors">顧問（一行一席，由上到下就是發言順序；顧問 1～3 位，含仲裁者共 2～4 席；格式 &lt;cli&gt;[:&lt;模型&gt;]）</label>
            <textarea id="advisors" rows="4">opencode:opencode/deepseek-v4-flash-free
opencode:opencode/nemotron-3-ultra-free
opencode:opencode/ling-3.0-flash-free</textarea>
            <span class="hint">可用的 cli：claude／codex／gemini／opencode，可以混搭。模型清單用各 CLI 自己的指令查（opencode 是 <code>opencode models</code>）。換模型就是改這一欄的文字，不必動任何程式碼。</span>
          </div>
          <div class="field">
            <label for="arbiter">仲裁者（不參與討論；按「叫仲裁者」才會呼叫它）</label>
            <input type="text" id="arbiter" value="claude">
          </div>
          <div class="field">
            <label for="context-file">脈絡（選填；送給每一位顧問，每輪重送）</label>
            <input type="file" id="context-file">
            <textarea id="context" rows="4"></textarea>
            <span class="hint">字元數：<span id="context-chars">0</span>。</span>
            <span class="hint">檔案由你的瀏覽器讀取後送出內容，伺服器不會去開你的檔案（SPEC.md §7.2）。</span>
          </div>
          <button type="submit" class="btn btn-primary">建立討論</button>
        </form>
      </div>

      <div id="discussion-view" hidden>
        <h1>討論</h1>
        <div id="stat-row">
          <div class="stat stat-accent">
            <span class="stat-icon">◷</span>
            <span class="stat-label">輪次</span>
            <span class="stat-value" id="st-rounds"></span>
            <span class="stat-note" id="st-cap"></span>
          </div>
          <div class="stat stat-mint">
            <span class="stat-icon">⚑</span>
            <span class="stat-label">格式違規</span>
            <span class="stat-value" id="st-violations"></span>
          </div>
          <div class="stat stat-sage">
            <span class="stat-icon">◎</span>
            <span class="stat-label">總呼叫</span>
            <span class="stat-value" id="st-calls"></span>
          </div>
        </div>
        <div class="question-card">
          <div id="question-text"></div>
          <div id="context-chars-text"></div>
        </div>
        <div id="converged-hint"></div>
        <div id="transcript"></div>
        <div id="action-row">
          <button id="btn-round" class="btn btn-primary">再一輪</button>
          <button id="btn-arbitration" class="btn btn-ghost">⚖ 叫仲裁者</button>
          <a id="btn-export" class="btn btn-ghost" download>↓ 匯出 Markdown</a>
          <span id="live-cost-warning"></span>
        </div>
      </div>
    </main>
  </div>

  <div id="usage-panel">
    <div id="usage-content"></div>
  </div>
</div>

<script>
"use strict";

var currentId = null;
var live = null;
var lastStatus = null;
var es = null;
var arbitrationPlaceholder = null;

function $(id) { return document.getElementById(id); }

function clearChildren(el) {
  while (el.firstChild) {
    el.removeChild(el.firstChild);
  }
}

function updateModeBadge() {
  var badge = $("mode-badge");
  var warning = $("live-cost-warning");
  if (live === null) {
    badge.textContent = "模式：尚未確認";
    badge.className = "badge badge-gray";
    warning.textContent = "";
  } else if (live === true) {
    badge.textContent = "LIVE — 每次開輪／仲裁都會消耗訂閱額度";
    badge.className = "badge badge-live";
    warning.textContent = "⚠️ 按下去會消耗訂閱額度";
  } else {
    badge.textContent = "DRY RUN — 不會呼叫任何 CLI";
    badge.className = "badge badge-gray";
    warning.textContent = "";
  }
}

function phaseLabel(phase) {
  if (phase === "ready") { return "準備中"; }
  if (phase === "in_round") { return "進行中"; }
  if (phase === "awaiting_user") { return "等你操作"; }
  return phase;
}

function setBusy(value) {
  $("btn-round").disabled = value;
  $("btn-arbitration").disabled = value;
  $("st-busy").textContent = value ? "忙碌中" : "";
}

function renderStatusBar(status) {
  $("st-phase").textContent = "相位：" + phaseLabel(status.phase);
  $("st-rounds").textContent = status.rounds_completed + " / " + status.max_rounds;
  $("st-cap").textContent = status.at_cap === true ? "已達上限" : "";
  $("converged-hint").textContent =
    status.converged === true ? "全體顧問都表示沒有補充了 — 可以收斂" : "";
  $("st-violations").textContent = status.format_violations;
  if (status.at_cap === true) {
    $("btn-round").textContent = "再一輪（需確認）";
  } else if (status.rounds_completed === 0) {
    $("btn-round").textContent = "開始討論（可延續數輪）";
  } else {
    $("btn-round").textContent = "再一輪";
  }
}

function flattenUsage(obj, prefix) {
  var out = {};
  Object.keys(obj).forEach(function (key) {
    var path = prefix ? prefix + "." + key : key;
    var value = obj[key];
    if (value !== null && typeof value === "object" && !Array.isArray(value)) {
      var sub = flattenUsage(value, path);
      Object.keys(sub).forEach(function (k) { out[k] = sub[k]; });
    } else if (typeof value === "number") {
      out[path] = value;
    }
  });
  return out;
}

// 金額不進畫面：council 不呼叫任何模型 API，這些數字是各家 CLI 依 API 定價
// 換算的參考值，顯示出來會讓人以為 council 在跟他收費（Frank 實測回報）。
function isCostKey(key) {
  return key.toLowerCase().indexOf("cost") !== -1;
}

function renderUsageDict(label, usage) {
  var container = document.createElement("div");
  if (label) {
    var head = document.createElement("div");
    head.textContent = label;
    container.appendChild(head);
  }
  var flat = flattenUsage(usage, "");
  var keys = Object.keys(flat).filter(function (key) {
    return !isCostKey(key);
  });
  keys.sort();
  keys.forEach(function (key) {
    var row = document.createElement("div");
    row.className = "usage-row";
    var k = document.createElement("span");
    k.textContent = key;
    var v = document.createElement("span");
    v.textContent = flat[key];
    row.appendChild(k);
    row.appendChild(v);
    container.appendChild(row);
  });
  return container;
}

function renderUsage(status) {
  $("st-calls").textContent = (status && status.usage) ? status.usage.calls : 0;
  var content = $("usage-content");
  clearChildren(content);
  var heading = document.createElement("div");
  heading.textContent = "用量（token 消耗）";
  content.appendChild(heading);
  var note = document.createElement("div");
  note.className = "hint";
  note.textContent = "council 不呼叫任何模型 API：這些數字由你自己的 CLI 回報，"
    + "用掉的是那個 CLI 的訂閱額度。";
  content.appendChild(note);
  if (!status || !status.usage) { return; }
  var usage = status.usage;
  // 各席次分列排在累加區之前：累加區是同名欄位各自相加的混合體，
  // 先看到它會把它讀成總計。
  Object.keys(usage.by_seat).sort().forEach(function (seatId) {
    var per = usage.by_seat[seatId];
    var block = document.createElement("div");
    block.className = "seat-block";
    var line = document.createElement("div");
    line.textContent = seatId + "：calls=" + per.calls;
    block.appendChild(line);
    if (per.usage && Object.keys(per.usage).length > 0) {
      block.appendChild(renderUsageDict("", per.usage));
    }
    content.appendChild(block);
  });
  var total = usage.total;
  if (total && Object.keys(total).length > 0) {
    content.appendChild(renderUsageDict("各席次同名欄位累加", total));
    var mixed = document.createElement("div");
    mixed.className = "hint";
    mixed.textContent = "⚠️ 各家 CLI 的欄位名稱不同（opencode 是 tokens.*，"
      + "claude 是 input_tokens／output_tokens），上面這一區只是把名稱相同的欄位"
      + "各自相加，不是所有席次的總和。要看真實用量請看上面各席次分列。";
    content.appendChild(mixed);
  } else {
    var none = document.createElement("div");
    none.textContent = "（本次未取得用量統計）";
    content.appendChild(none);
  }
  var cacheNote = document.createElement("div");
  cacheNote.className = "hint";
  cacheNote.textContent = "claude 的輸入多半計在 cache_creation_input_tokens，"
    + "input_tokens 顯示得很小是正常的，不代表逐字稿沒送進去。";
  content.appendChild(cacheNote);
}

function badge(text) {
  var el = document.createElement("span");
  el.className = "badge badge-small";
  el.textContent = text;
  return el;
}

function addSpeechCard(rec) {
  var card = document.createElement("div");
  card.className = "card";
  var head = document.createElement("div");
  head.className = "card-head";
  head.textContent = rec.seat_id;
  card.appendChild(head);
  var badgeRow = document.createElement("div");
  badgeRow.className = "badge-row";
  if (rec.stance) { badgeRow.appendChild(badge("立場: " + rec.stance)); }
  if (rec.more === false) { badgeRow.appendChild(badge("補充: 無")); }
  if (rec.truncated) { badgeRow.appendChild(badge("已截斷")); }
  if (rec.violation) { badgeRow.appendChild(badge("格式違規")); }
  if (rec.model_used === null) { badgeRow.appendChild(badge("模型未經確認")); }
  if (typeof rec.elapsed_s === "number") {
    badgeRow.appendChild(badge(rec.elapsed_s.toFixed(1) + " 秒"));
  }
  if (badgeRow.firstChild) { card.appendChild(badgeRow); }
  var body = document.createElement("div");
  body.className = "speech-text";
  if (rec.ok === true) {
    body.textContent = rec.text;
  } else {
    body.textContent = rec.error ? "未回應：" + rec.error : "未回應";
  }
  card.appendChild(body);
  $("transcript").appendChild(card);
}

function addRoundHeading(round) {
  var h = document.createElement("div");
  h.className = "round-heading";
  h.textContent = "第 " + round + " 輪";
  $("transcript").appendChild(h);
}

function addArbitrationPlaceholder(seatId) {
  var el = document.createElement("div");
  el.className = "card arbitration pending";
  el.textContent = "仲裁者 " + seatId + " 正在讀完整逐字稿…";
  $("transcript").appendChild(el);
  return el;
}

function clearArbitrationPlaceholder() {
  if (arbitrationPlaceholder && arbitrationPlaceholder.parentNode) {
    arbitrationPlaceholder.parentNode.removeChild(arbitrationPlaceholder);
  }
  arbitrationPlaceholder = null;
}

function addArbitrationCard(rec) {
  var card = document.createElement("div");
  card.className = "card arbitration";
  var head = document.createElement("div");
  head.className = "card-head";
  head.textContent = "仲裁者 — 不參與輪替、不計入收斂（" + rec.seat_id + "）";
  card.appendChild(head);
  var body = document.createElement("div");
  body.className = "speech-text";
  if (rec.ok === true) {
    body.textContent = rec.text;
  } else {
    body.textContent = rec.error ? "未回應：" + rec.error : "未回應";
  }
  card.appendChild(body);
  $("transcript").appendChild(card);
}

function showFormError(message) {
  $("form-error").textContent = message;
}

function showForm() {
  closeSse();
  currentId = null;
  $("btn-export").removeAttribute("href");
  lastStatus = null;
  $("st-id").textContent = "";
  $("st-phase").textContent = "";
  $("st-rounds").textContent = "";
  $("converged-hint").textContent = "";
  $("st-violations").textContent = "";
  $("st-sse").textContent = "";
  setBusy(false);
  $("form-view").hidden = false;
  $("discussion-view").hidden = true;
  renderUsage(null);
}

function renderDiscussion(data) {
  currentId = data.id;
  $("btn-export").href = "/api/discussions/" + data.id + "/export.md";
  $("st-id").textContent = "討論 id：" + data.id;
  $("question-text").textContent = "原始問題：" + data.question;
  $("context-chars-text").textContent = "脈絡字元數：" + data.context_chars;
  var seats = $("seat-list");
  clearChildren(seats);
  data.seats.forEach(function (seat) {
    var row = document.createElement("div");
    row.textContent = seat.seat_id + " — " + seat.cli +
      (seat.model ? "：" + seat.model : "") +
      "（" + (seat.role === "arbiter" ? "仲裁者" : "顧問") + "）";
    row.className = "seat-row";
    seats.appendChild(row);
  });
  clearChildren($("transcript"));
  setBusy(data.busy === true);
  renderStatusBar(data.status);
  renderUsage(data.status);
  lastStatus = data.status;
}

function postJson(path, body) {
  return fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (resp) {
    return resp.json().then(function (data) {
      return { status: resp.status, data: data };
    }).catch(function () {
      return { status: resp.status, data: null };
    });
  });
}

function refreshDiscussion() {
  if (!currentId) { return; }
  fetch("/api/discussions/" + encodeURIComponent(currentId)).then(function (resp) {
    return resp.json();
  }).then(function (data) {
    if (data && data.id) {
      live = data.live;
      updateModeBadge();
      setBusy(data.busy === true);
      renderStatusBar(data.status);
      renderUsage(data.status);
      lastStatus = data.status;
    }
  }).catch(function () {
    $("st-sse").textContent = "無法連上伺服器（它可能已經停止）";
  });
}

function runAction(path, body) {
  setBusy(true);
  postJson(path, body).then(function (result) {
    if (result.status === 200) {
      setBusy(false);
      live = result.data.live;
      updateModeBadge();
      renderStatusBar(result.data.status);
      renderUsage(result.data.status);
      lastStatus = result.data.status;
    } else if (result.status === 409) {
      setBusy(false);
      clearArbitrationPlaceholder();
      if (result.data && result.data.code === "busy") {
        $("st-sse").textContent = "另一個分頁正在跑這個討論。";
        refreshDiscussion();
      } else {
        $("st-sse").textContent =
          (result.data && result.data.error) || "已達停止邊界，無法執行";
      }
    } else {
      setBusy(false);
      clearArbitrationPlaceholder();
      $("st-sse").textContent =
        (result.data && result.data.error) || ("HTTP " + result.status);
    }
  }).catch(function () {
    setBusy(false);
    $("st-sse").textContent = "無法連上伺服器（它可能已經停止）";
  });
}

function connectSse(id) {
  closeSse();
  es = new EventSource("/api/discussions/" + encodeURIComponent(id) + "/events?cursor=0");
  es.onopen = function () {
    $("st-sse").textContent = "";
  };
  es.onerror = function () {
    $("st-sse").textContent = "連線中斷，瀏覽器會自動重連";
  };
  es.addEventListener("round_started", function (ev) {
    var data = JSON.parse(ev.data);
    setBusy(true);
    addRoundHeading(data.round);
  });
  es.addEventListener("speech", function (ev) {
    addSpeechCard(JSON.parse(ev.data));
  });
  es.addEventListener("round_finished", function (ev) {
    var data = JSON.parse(ev.data);
    setBusy(false);
    renderStatusBar(data.status);
    renderUsage(data.status);
    lastStatus = data.status;
  });
  es.addEventListener("arbitration_started", function (ev) {
    var data = JSON.parse(ev.data);
    setBusy(true);
    arbitrationPlaceholder = addArbitrationPlaceholder(data.seat_id);
  });
  es.addEventListener("arbitration_finished", function (ev) {
    var data = JSON.parse(ev.data);
    setBusy(false);
    clearArbitrationPlaceholder();
    addArbitrationCard(data.record);
    renderUsage(data.status);
    lastStatus = data.status;
  });
  es.addEventListener("error", function (ev) {
    if (!ev.data) { return; }   // 傳輸層斷線也叫 error，那個由 onerror 負責
    $("st-sse").textContent = "收到 error 事件";
  });
}

function closeSse() {
  if (es) {
    es.close();
    es = null;
  }
}

function openDiscussion(id) {
  closeSse();
  clearChildren($("transcript"));
  fetch("/api/discussions/" + encodeURIComponent(id)).then(function (resp) {
    if (resp.status === 404) {
      location.hash = "";
      showForm();
      showFormError("找不到這個討論。伺服器一重啟，記憶體裡的討論就消失了（SPEC.md §7.1）。");
      return null;
    }
    return resp.json().then(function (data) {
      if (!resp.ok) {
        location.hash = "";
        showForm();
        showFormError((data && data.error) || ("HTTP " + resp.status));
        return null;
      }
      return data;
    });
  }).then(function (data) {
    if (!data) { return; }
    live = data.live;
    updateModeBadge();
    $("form-view").hidden = true;
    $("discussion-view").hidden = false;
    renderDiscussion(data);
    connectSse(data.id);
  }).catch(function () {
    $("st-sse").textContent = "無法連上伺服器（它可能已經停止）";
  });
}

function onLoad() {
  var id = location.hash.slice(1);
  if (id) {
    openDiscussion(id);
  } else {
    showForm();
  }
}

$("create-form").addEventListener("submit", function (event) {
  event.preventDefault();
  $("form-error").textContent = "";
  var advisors = [];
  $("advisors").value.split("\n").forEach(function (line) {
    var trimmed = line.trim();
    if (trimmed) { advisors.push(trimmed); }
  });
  var question = $("question").value.trim();
  var arbiter = $("arbiter").value.trim();
  var context = $("context").value;
  postJson("/api/discussions", {
    question: question,
    advisors: advisors,
    arbiter: arbiter,
    context: context
  }).then(function (result) {
    if (result.status === 200 && result.data && result.data.id) {
      location.hash = result.data.id;
    } else {
      showFormError((result.data && result.data.error) || ("HTTP " + result.status));
    }
  });
});

$("btn-round").addEventListener("click", function () {
  var body = {};
  if (lastStatus && lastStatus.at_cap === true) {
    var ok = window.confirm("已達 " + lastStatus.max_rounds +
      " 輪上限。再開一輪會再向每一位顧問各發出一次呼叫（會花錢）。確定要繼續嗎？");
    if (!ok) { return; }
    body = {confirm_over_cap: true};
  }
  runAction("/api/discussions/" + encodeURIComponent(currentId) + "/rounds", body);
});

$("btn-arbitration").addEventListener("click", function () {
  runAction("/api/discussions/" + encodeURIComponent(currentId) + "/arbitration", {});
});

$("btn-new").addEventListener("click", function () {
  location.hash = "";
});

$("context-file").addEventListener("change", function () {
  var file = this.files && this.files[0];
  if (!file) { return; }
  var reader = new FileReader();
  reader.onload = function () {
    $("context").value = reader.result;
    $("context-chars").textContent = reader.result.length;
  };
  reader.readAsText(file);
});

$("context").addEventListener("input", function () {
  $("context-chars").textContent = this.value.length;
});

window.addEventListener("hashchange", onLoad);
onLoad();
</script>
</body>
</html>
